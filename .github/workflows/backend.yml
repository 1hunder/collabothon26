name: backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fq
          POSTGRES_PASSWORD: fq
          POSTGRES_DB: financequest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fq -d financequest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fq:fq@localhost:5432/financequest
      FAKE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy financequest
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
